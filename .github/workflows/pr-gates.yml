name: PR gates (docs/04 §8)

on:
  pull_request:
  push:
    # `leyon` 是日常集成分支：单测只能在此与 main 上执行（docs/02 §4），
    # 不列入触发分支就等于让合入 main 前的代码从没被测过。
    branches: [main, leyon]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Spotless check (docs/02 §5)
        working-directory: mod
        run: ./gradlew spotlessCheck --no-daemon

      # `buildSrc` is a separate build: the main build compiles it but never runs its
      # `test` task, so ModuleDependencyRulesTest only executes when invoked explicitly.
      - name: buildSrc unit tests (dependency-rule assertions)
        working-directory: mod
        run: ./gradlew -p buildSrc test --no-daemon

      # `build` runs `check`, which `strife.conventions` wires to include `checkImports`
      # (docs/03 §2 module dependency chain) and the unit tests.
      - name: Build + unit tests + module dependency assertions
        working-directory: mod
        run: ./gradlew build --no-daemon

      # `git diff` only ever compares tracked paths, so a product that was never committed
      # (new table row, or a whole new domain directory) leaves the diff empty and this gate
      # stays green while the content is absent from the jar. Untracked paths must be scanned
      # separately — this is the "CI 绿但没真跑" shape docs/04 §8 warns about.
      - name: DataGen freshness (docs/04 §5 / §6 "产物新鲜")
        working-directory: mod
        run: |
          ./gradlew :tools:datagen:run --no-daemon
          untracked=$(git -C .. ls-files --others --exclude-standard -- mod/content-base)
          git -C .. diff --exit-code -- mod/content-base \
            || { echo "::error::generated content is stale — run ./gradlew :tools:datagen:run and commit the output"; exit 1; }
          if [ -n "$untracked" ]; then
            printf '::error::DataGen wrote files that are not committed:\n%s\n' "$untracked"
            exit 1
          fi

      - name: Content validator (docs/04 §6)
        working-directory: mod
        run: ./gradlew validator --no-daemon

      # Unit tests cannot run on the Windows dev box (docs/02 §4), so CI is their only
      # execution venue. A green `build` would still be compatible with "a module's tests
      # were silently skipped (NO-SOURCE / missing engine)", hence the per-module gate:
      # a global count alone could be satisfied by one module while another runs zero.
      - name: Assert unit tests actually executed
        if: always()
        working-directory: mod
        run: |
          {
            echo "## 单测执行证据（本机不可运行，CI 为唯一执行处）"
            echo ""
            echo '```'
            find . -path '*/build/test-results/test/*.xml' -printf '%P\n' | sort | while read -r f; do
              printf '%-58s %s\n' "$f" "$(grep -c '<testcase' "$f")"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for dir in buildSrc platform tools/validator tools/datagen; do
            n=$(grep -h -o '<testcase' "./$dir/build/test-results/test"/*.xml 2>/dev/null | wc -l)
            echo "$dir: $n testcases"
            if [ "$n" -lt 1 ]; then
              echo "::error::$dir ran 0 unit tests (skipped? missing junit engine?)"
              failed=1
            fi
          done
          exit $failed

      # Gates not yet lit — each lights up with its own ticket, never with a stub that
      # reports success without checking anything (docs/06 §4: an unverified pass is a fail).
      # - validator 覆盖 docs/04 §6 八项中的 2 项（V-DUP / V-FRESH，后者已支持 content/
      #   NUMBERS.md 源头）+ 两个子项：V-RANGE 成长比（V-GROWTH，区间读 NUMBERS @@limits）
      #   与 V-TEXT zh_cn/en_us 覆盖（--assets-root）。content/ 未合入（A0-7）时 V-GROWTH 与
      #   content/ 源头的新鲜度校验在 CI 打印声明并跳过，真相源合入后自动生效；其余 4 项
      #   不是漏写：引用存在性 / DAG 连通 / 概率归一 / 数值越界其余子项 / DSL 合法要等内容
      #   表继续填行。step 摘要里的 checks=3（content/ 未合入）或 checks=4（已合入）就是这个
      #   差距的读数，别把它读成"全项已过"。
      # - content-base-X.Y.Z.zip 导出（docs/04 §9 热更通道）  -> 待立工单
      # Nightly (docs/04 §8): tick 采样 / 灵气场 chunk 生成耗时 / 丹方蒙特卡洛 10 万 / 2h 长跑 -> M2+

  # docs/03 §7: "M0 起每个里程碑 CI 必须执行'纯净 jar 独立启动冒烟'（headless 开服 60s 无异常）".
  # All assertions live in .github/scripts/server-smoke.sh — the same file the Windows box runs,
  # so the gate is never "a shell block CI ran once and nobody read".
  server-smoke:
    name: 纯净服务端 jar headless 冒烟 (docs/03 §7, A0-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build the dedicated-server artifact
        working-directory: mod
        run: ./gradlew :platform:serverJar --no-daemon

      - name: Install a clean NeoForge dedicated server
        run: |
          set -euo pipefail
          nv=$(grep '^neoforge_version=' mod/gradle.properties | cut -d= -f2)
          work="$RUNNER_TEMP/strife-server-smoke"
          rm -rf "$work"
          mkdir -p "$work"
          curl -fsSLo "$work/installer.jar" \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/$nv/neoforge-$nv-installer.jar"
          (cd "$work" && java -jar installer.jar --installServer > install.log 2>&1)
          test -f "$work/run.sh"
          # 生成物的可执行位不在本仓库手里，安装器给什么权限不确定；这里补上，避免"权限不足"
          # 被读成"纯净 jar 起不来"。断言一条都没放松。
          chmod +x "$work/run.sh"

      - name: Boot it headless with only the strife server jar, 60s
        run: |
          set -euo pipefail
          SMOKE_JAR="$(realpath mod/platform/build/libs/strife-server-*.jar)" \
            bash .github/scripts/server-smoke.sh "$RUNNER_TEMP/strife-server-smoke" ./run.sh

      - name: Upload the server log (evidence, not just a red/green badge)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: ${{ runner.temp }}/strife-server-smoke/server.log
