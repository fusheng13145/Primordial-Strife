plugins {
    id 'java-library'
    id 'strife.conventions'
}

// content-base is a pure resources module: docs/02 §3 forbids src/main/java here.
// The buildSrc checkImports task asserts that on every CI run.
sourceSets {
    main {
        java.srcDirs = []
    }
}

jar {
    archiveBaseName = 'content-base'
}

// docs/04 §9 / docs/07 §5: the standalone content pack modpack authors can swap in.
// Loaded with lower priority than the built-in copy, so "same-ID override" stays deliberate.
tasks.register('contentZip', Zip) {
    group = 'build'
    description = 'Packs content-base resources into the standalone content zip (docs/04 §9 热更通道).'
    archiveBaseName = 'content-base'
    archiveVersion = providers.gradleProperty('mod_version')
    destinationDirectory = layout.buildDirectory.dir('libs')
    from 'src/main/resources'
}
