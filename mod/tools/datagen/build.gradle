plugins {
    id 'application'
    id 'strife.conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.strife.tools.datagen.DataGenMain'
}

dependencies {
    // Product bytes are hand-written, so the tests parse them with a real JSON reader.
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def repoRoot = rootProject.projectDir.parentFile

run {
    workingDir = repoRoot
    args = [
            '--tables-root',
            file("${repoRoot}/tables").toString(),
            '--resources-root',
            project(':content-base').file('src/main/resources').toString()]
    // The CI freshness step must show the summary without --info.
    logging.captureStandardOutput(LogLevel.LIFECYCLE)
    logging.captureStandardError(LogLevel.LIFECYCLE)
}
