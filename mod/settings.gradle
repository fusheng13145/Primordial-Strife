pluginManagement {
    plugins {
        // Plugin versions live here (dependency versions live in gradle.properties, docs/02 §2).
        id 'com.diffplug.spotless' version '8.10.2'
        id 'net.neoforged.moddev' version '2.0.147'
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

dependencyResolutionManagement {
    repositories {
        // P1-11/12（ADR-028 ③）：JEI/Patchouli 走本地 vendor 仓（maven 布局）——2026-11-01 实证
        // 本机代理截断 blamejared 二进制、maven.neoforged.net 拒连，故离线化：jar 就位即生效
        // （解锁步骤见 platform/build.gradle dependencies 注释）。
        exclusiveContent {
            forRepository {
                maven { url = file('vendor') }
            }
            filter {
                includeGroup 'mezz.jei'
                includeGroup 'vazkii.patchouli'
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'strife'

include 'platform'
include 'content-base'
include 'tools:datagen'
include 'tools:validator'
