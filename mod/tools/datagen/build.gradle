plugins {
    id 'application'
    id 'strife.conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.strife.tools.datagen.DataGenMain'
}

dependencies {
    // Product bytes are hand-written, so the tests parse them with a real JSON reader.
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def repoRoot = rootProject.projectDir.parentFile

run {
    // 修复：Gradle JavaExec 默认不追踪非 classpath 文件——NUMBERS.md 变了但任务 UP-TO-DATE 跳过，
    // 导致产物指纹漂移（2026-11-02 实证）。追踪后 Gradle 在 NUMBERS.md 变更时强制重跑。
    inputs.file("${repoRoot}/content/NUMBERS.md")
    workingDir = repoRoot
    args = [
            '--tables-root',
            file("${repoRoot}/tables").toString(),
            '--resources-root',
            project(':content-base').file('src/main/resources').toString(),
            // NUMBERS.md is read lazily: generators only demand it when a *_key cell needs
            // a value, so CI runs over empty tables work while content/ (A0-7) is unmerged.
            '--content-root',
            file("${repoRoot}/content").toString()]
    // The CI freshness step must show the summary without --info.
    logging.captureStandardOutput(LogLevel.LIFECYCLE)
    logging.captureStandardError(LogLevel.LIFECYCLE)
}
