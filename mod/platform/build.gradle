import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'strife.conventions'
    id 'net.neoforged.moddev'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// docs/04 §1 "构建进 jar" / §9 内置内容: content-base is where DataGen writes and this jar is
// what ships. Nothing else bridges the two — without this srcDir the generated JSON sits in a
// module no one depends on, so "填表 → 进游戏" is false while datagen, the drift gate and the
// validator all stay green (docs/04 §8: 看起来绿其实没跑).
// It also fixes the dev runs: `mods { strife { sourceSet sourceSets.main } }` below publishes
// this source set's resources to runClient/runServer/runData.
def contentResources = project(':content-base').file('src/main/resources')

sourceSets {
    main {
        resources {
            srcDir contentResources
        }
    }
}

neoForge {
    version = providers.gradleProperty('neoforge_version').get()

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        strife {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.strife
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${providers.gradleProperty('junit_version').get()}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = providers.gradleProperty('mod_id')
}

// docs/03 §7 纯净服务端 jar (A0-8). The exclusion patterns are deliberately in place before the
// first client-only class exists, so client_fx gets stripped by default rather than by someone
// remembering to add a filter later. They match nothing today: the platform module only has
// com.strife.core, and the 分侧 ModEntrypoint half of 03 §7 is core work (docs/06 禁区) that
// needs no build-side change until client_fx lands — verified by the CI headless smoke, which
// boots this artifact on a dedicated server (log line: "Service=ModLauncher Env=SERVER").
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Dedicated-server artifact: platform output with client-only packages excluded (docs/03 §7).'
    archiveBaseName = "${providers.gradleProperty('mod_id').get()}-server"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    exclude 'com/strife/client_fx/**'
    exclude 'assets/strife/client_fx/**'
}

processResources {
    inputs.properties(
            mod_version: providers.gradleProperty('mod_version').get(),
            mod_id: providers.gradleProperty('mod_id').get(),
            mod_display_name: providers.gradleProperty('mod_display_name').get(),
            mod_description: providers.gradleProperty('mod_description').get(),
            minecraft_version: providers.gradleProperty('minecraft_version').get(),
            neoforge_loader_range: providers.gradleProperty('neoforge_loader_range').get(),
            neoforge_version: providers.gradleProperty('neoforge_version').get(),
            java_version: providers.gradleProperty('java_version').get())
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(inputs.properties)
    }
}

// The srcDir above is the only thing that makes generated content ship, and dropping it changes
// no other outcome: DataGen still writes, the drift gate still compares tracked files, the
// validator still reads the resources directory. So the pipeline would stay green while the jar
// has no content in it. This asserts the last mile instead of assuming it.
tasks.register('checkContentBundled') {
    group = 'verification'
    description = 'Fails if a content-base resource is absent from a shipped platform jar (docs/04 §1, §8).'
    def artifacts = [
            jar      : tasks.named('jar', Jar).flatMap { it.archiveFile },
            serverJar: tasks.named('serverJar', Jar).flatMap { it.archiveFile }
    ]
    dependsOn artifacts.values()
    doLast {
        def onDisk = new TreeSet<String>()
        if (contentResources.exists()) {
            contentResources.eachFileRecurse { f ->
                if (f.isFile()) {
                    onDisk << contentResources.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                }
            }
        }
        artifacts.each { name, provider ->
            def inJar = new HashSet<String>()
            new ZipFile(provider.get().asFile).withCloseable { zip ->
                zip.entries().each { inJar << it.name }
            }
            def missing = onDisk.findAll { !inJar.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException(
                        ":platform:${name} does not ship generated content: " + missing +
                        " — content-base is not wired into sourceSets.main.resources (docs/04 §1) " +
                        "or the jar task filters it out")
            }
        }
        logger.lifecycle("checkContentBundled: ${onDisk.size()} content file(s) present in jar and serverJar")
    }
}

tasks.named('check') {
    dependsOn 'checkContentBundled'
}
